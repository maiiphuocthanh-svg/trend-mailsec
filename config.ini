; =====================================================================
;  CẤU HÌNH GỬI MAIL TEST - Trend Micro Cloud App Security (CAS)
; =====================================================================
;  Chỉnh sửa các giá trị dưới đây trước khi chạy script.
;  LƯU Ý: Gmail yêu cầu "App Password" (16 ký tự), KHÔNG dùng mật khẩu
;         đăng nhập thường. Xem huong dan lay App Password trong README.
; =====================================================================

[smtp]
; Máy chủ SMTP của Gmail - giữ nguyên
host = smtp.gmail.com
port = 587

; Email Gmail dùng để GỬI mail test
username = your_gmail@gmail.com

; App Password 16 ký tự (ví dụ: abcd efgh ijkl mnop -> nhập abcdefghijklmnop)
app_password = xxxxxxxxxxxxxxxx

[recipient]
; Mailbox ĐÍCH để nhận mail test (được CAS bảo vệ)
to = opmanager@pocmail.fecredit.com.vn

[options]
; Khoảng nghỉ (giây) giữa mỗi email để tránh bị Gmail rate-limit
delay_seconds = 5

; Địa chỉ From giả mạo dùng cho test Phishing (test case #4)
; CAS sẽ kiểm tra tính hợp lệ của người gửi
spoofed_from = ceo@fecredit-secure.com

; Mật khẩu dùng cho file nén có mật khẩu (test case #7)
zip_password = infected
